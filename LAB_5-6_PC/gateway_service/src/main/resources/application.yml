server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: route_service
          uri: http://route_service:8081
          predicates:
            - Path=/route/**
          filters:
            - StripPrefix=1

        - id: vehicle_service
          uri: http://vehicle_service:8082
          predicates:
            - Path=/vehicles/**
          filters:
            - StripPrefix=1

        - id: schedule_service
          uri: http://schedule_service:8083
          predicates:
            - Path=/schedules/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: "*"